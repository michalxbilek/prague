<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prague Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root {
    --bg: #f6f0e6;
    --surface: #fffaf1;
    --surface2: #efe4d2;
    --border: #d7c7ac;
    --gold: #9f7621;
    --gold-light: #c6922e;
    --text: #2b241a;
    --muted: #766c5c;
    --white: #17140f;
    --breakfast: #d4845a;
    --food: #70a86f;
    --bar: #8b7fd4;
    --club: #d46b8e;
    --coffee: #b98526;
    --place: #3fa9bd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    position: relative;
    padding: 52px 24px 36px;
    text-align: center;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    opacity: 0;
    animation: fadeUp 0.6s ease 0.1s forwards;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(44px, 12vw, 72px);
    font-weight: 400;
    color: var(--white);
    line-height: 1.0;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.2s forwards;
  }
  h1 em { font-style: italic; color: var(--gold-light); }
  .header-sub {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.35s forwards;
  }
  .divider {
    width: 40px; height: 1px;
    background: var(--gold);
    margin: 20px auto 0;
    opacity: 0;
    animation: fadeIn 0.6s ease 0.5s forwards;
  }

  .view-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin: 20px 16px 0;
    overflow: hidden;
    max-width: 568px;
    margin-left: auto;
    margin-right: auto;
  }
  .view-btn {
    flex: 1;
    padding: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    transition: color 0.2s, background 0.2s;
  }
  .view-btn.active { background: var(--surface2); color: var(--white); }

  .filters {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(246,240,230,0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0;
    padding: 14px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover { color: var(--text); }
  .filter-btn.active { color: var(--white); border-bottom-color: var(--gold); }

  #map-view {
    display: none;
    position: relative;
    height: calc(100vh - 185px);
    min-height: 520px;
  }
  #map-view.active { display: block; }
  #map { width: 100%; height: 100%; }

  .map-panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    width: min(340px, calc(100vw - 24px));
    max-height: calc(100% - 24px);
    overflow: auto;
    background: rgba(255,250,241,0.95);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 14px 42px rgba(51, 38, 16, 0.18);
    backdrop-filter: blur(10px);
  }
  .panel-head {
    position: sticky;
    top: 0;
    background: rgba(255,250,241,0.98);
    z-index: 2;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    color: var(--white);
  }
  .panel-actions {
    display: flex;
    gap: 8px;
  }
  .mini-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 9px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .mini-btn:active { transform: translateY(1px); }
  .legend-group {
    border-bottom: 1px solid var(--border);
  }
  .legend-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: transparent;
    border: 0;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    color: var(--text);
  }
  .legend-row.off { opacity: 0.42; }
  .legend-checkbox {
    width: 17px;
    height: 17px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    position: relative;
    flex-shrink: 0;
  }
  .legend-row:not(.off) .legend-checkbox::after {
    content: '✓';
    position: absolute;
    inset: -1px 0 0;
    display: grid;
    place-items: center;
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .legend-count { margin-left: auto; font-size: 11px; color: var(--muted); }
  .legend-names {
    padding: 0 14px 12px 51px;
    display: grid;
    gap: 6px;
  }
  .legend-group.off .legend-names { display: none; }
  .pin-name {
    background: none;
    border: 0;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    line-height: 1.35;
    text-align: left;
    cursor: pointer;
    padding: 2px 0;
  }
  .pin-name:hover { color: var(--white); }

  .leaflet-popup-content-wrapper {
    background: #fffaf1 !important;
    border: 1px solid #d7c7ac !important;
    border-radius: 12px !important;
    box-shadow: 0 8px 28px rgba(51,38,16,0.24) !important;
    color: #2b241a !important;
  }
  .leaflet-popup-tip { background: #fffaf1 !important; }
  .leaflet-popup-content { margin: 13px 16px !important; min-width: 180px; }
  .popup-name { font-size: 14px; font-weight: 700; color: #17140f; margin-bottom: 4px; }
  .popup-desc { font-size: 11px; color: #766c5c; line-height: 1.5; margin-bottom: 9px; }
  .popup-link { font-size: 11px; font-weight: 700; color: #9f7621; text-decoration: none; letter-spacing: 0.04em; }
  .popup-link:hover { color: #c6922e; }
  .leaflet-container { background: #e9dfcc !important; }
  .leaflet-control-zoom a { background: #fffaf1 !important; color: #2b241a !important; border-color: #d7c7ac !important; }
  .leaflet-control-zoom a:hover { background: #efe4d2 !important; }

  #list-view { display: block; }
  main {
    padding: 0 16px 80px;
    max-width: 600px;
    margin: 0 auto;
  }
  .section {
    margin-top: 40px;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .section-icon { font-size: 18px; line-height: 1; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 400; color: var(--white); letter-spacing: -0.01em; }
  .section-count { font-size: 11px; color: var(--muted); margin-left: auto; letter-spacing: 0.05em; }
  .section-line { width: 100%; height: 1px; background: var(--border); margin-bottom: 4px; }
  .place-card {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    text-decoration: none; color: inherit;
    transition: background 0.15s;
    border-radius: 4px; cursor: pointer;
  }
  .place-card:last-child { border-bottom: none; }
  .place-card:active { background: var(--surface); }
  .card-dot { flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
  .card-body { flex: 1; min-width: 0; }
  .card-name { font-size: 15px; font-weight: 700; color: var(--white); line-height: 1.3; }
  .card-desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .card-arrow { flex-shrink: 0; color: var(--muted); font-size: 14px; margin-top: 2px; transition: color 0.2s, transform 0.2s; }
  .place-card:active .card-arrow { color: var(--gold); transform: translateX(3px); }
  .section.hidden { display: none; }

  footer { text-align: center; padding: 32px 24px; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

  @media (max-width: 720px) {
    #map-view {
      height: calc(100vh - 160px);
      min-height: 560px;
    }
    .map-panel {
      top: auto;
      bottom: 12px;
      max-height: 46%;
      border-radius: 18px;
    }
    .legend-names {
      grid-template-columns: 1fr 1fr;
      column-gap: 12px;
    }
  }

  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>

<header>
  <div class="header-label">A local's guide</div>
  <h1>Praha<br><em>Guide</em></h1>
  <p class="header-sub" id="header-sub">31 places · 6 categories</p>
  <div class="divider"></div>
</header>

<div class="view-toggle">
  <button class="view-btn active" id="btn-list">☰&nbsp; List</button>
  <button class="view-btn" id="btn-map">⊕&nbsp; Map</button>
</div>

<nav class="filters" id="filter-nav"></nav>

<div id="map-view">
  <div id="map"></div>
  <aside class="map-panel" id="map-panel">
    <div class="panel-head">
      <div class="panel-title">Pins</div>
      <div class="panel-actions">
        <button class="mini-btn" id="show-all" type="button">All</button>
        <button class="mini-btn" id="hide-all" type="button">None</button>
      </div>
    </div>
    <div id="map-legend"></div>
  </aside>
</div>

<div id="list-view">
  <main id="place-list"></main>
</div>

<footer>Praha · Made with ♥</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CATEGORIES = [
  { key:'breakfast', label:'Breakfast', short:'Breakfast', icon:'🍳', color:'#d4845a' },
  { key:'food',      label:'Food',      short:'Food',      icon:'🍽️', color:'#70a86f' },
  { key:'coffee',    label:'Coffee',    short:'Coffee',    icon:'☕', color:'#b98526' },
  { key:'bar',       label:'Bar',       short:'Bar',       icon:'🍸', color:'#8b7fd4' },
  { key:'club',      label:'Club',      short:'Club',      icon:'🎵', color:'#d46b8e' },
  { key:'place',     label:'Spots to hang', short:'Spots', icon:'🌿', color:'#3fa9bd' }
];

const PLACES = [
  { name:'Srnky', cat:'breakfast', desc:'Vinohrady go-to · gluten-free options, stunning porridge', lat:50.075862, lng:14.440404 },
  { name:'Bistro Monk', cat:'breakfast', desc:'Old Town · great avocado toast & coffee, expect queues', lat:50.085906, lng:14.420025 },
  { name:'Sisters Bistro v Dlouhé', cat:'breakfast', desc:'Czech open-faced sandwiches (chlebíčky) done perfectly', lat:50.090807, lng:14.426962 },
  { name:'artic Bakehouse', cat:'breakfast', desc:'Malá Strana · takeaway only, incredible pastries & croissants', lat:50.080374, lng:14.404468 },
  { name:'Můj šálek kávy', cat:'breakfast', desc:'Karlín legend · big portions, excellent iced matcha & brunch', lat:50.093531, lng:14.455094 },
  { name:'Místo Café', cat:'breakfast', desc:'Letná neighbourhood · locals hang out, Turkish eggs are a must', lat:50.099056, lng:14.404450 },

  { name:'Lokál Dlouhááá', cat:'food', desc:'Classic Czech pub food · famous Pilsner Urquell · Dlouhá branch', lat:50.090693, lng:14.425757 },
  { name:'Kantýna', cat:'food', desc:'Butcher canteen in a converted bank vault · tartare is unmissable', lat:50.083504, lng:14.428919 },
  { name:'Vinohradský Parlament', cat:'food', desc:'Beloved Vinohrady gastropub · Czech food elevated, great dumplings', lat:50.075423, lng:14.438329 },
  { name:'Mr.HotDoG', cat:'food', desc:'Holešovice · hot dogs, sliders and craft beers', lat:50.099493, lng:14.427781 },
  { name:'BIG SMOKERS', cat:'food', desc:'Texas-style BBQ · brisket & ribs, homemade sauces', lat:50.103031, lng:14.450926 },
  { name:'BON Fresh Ramen & Soba', cat:'food', desc:'Vinohrady · ramen and soba spot', lat:50.076233, lng:14.436531 },
  { name:'Eska', cat:'food', desc:'Karlín · renowned bakery-restaurant', lat:50.091382, lng:14.454574 },
  { name:'PIPCA', cat:'food', desc:'Milady Horákové · rotisserie chicken & mash', lat:50.099677, lng:14.429157 },
  { name:'KRO Vinohrady', cat:'food', desc:'Vinohrady · rotisserie, bowls and casual plates', lat:50.078637, lng:14.450666 },
  { name:'Pizza Nuova', cat:'food', desc:'Upscale Italian near náměstí Republiky · book ahead', lat:50.089502, lng:14.427794 },
  { name:'Slice Slice Baby Pizza Club', cat:'food', desc:'Holešovice · creative pizza, very small space', lat:50.103302, lng:14.447195 },

  { name:'Vnitroblock', cat:'coffee', desc:'Holešovice · huge industrial concept space', lat:50.101940, lng:14.449329 },
  { name:'Café Letka', cat:'coffee', desc:'Letná neighbourhood favourite · weekend queues', lat:50.098240, lng:14.425372 },
  { name:'Kolektor', cat:'coffee', desc:'Holešovice · coffee, food and evening drinks', lat:50.101080, lng:14.432799 },
  { name:'EMA Espresso Bar', cat:'coffee', desc:'Near Florenc · excellent coffee, beautiful interior', lat:50.088728, lng:14.433502 },

  { name:'Cobra', cat:'bar', desc:'Milady Horákové · cocktail & wine bar, food too', lat:50.099200, lng:14.432115 },
  { name:'Forbína', cat:'bar', desc:'Theatrical high-end cocktail bar · every drink has a story', lat:50.081526, lng:14.413702 },

  { name:'ROXY', cat:'club', desc:'Legendary Prague club & live music venue in Old Town', lat:50.090689, lng:14.425874 },

  { name:'Milady Horákové', cat:'place', desc:'The main boulevard of Holešovice · cafés, bars and restaurants', lat:50.099873, lng:14.427122 },
  { name:'Střelecký ostrov', cat:'place', desc:'Peaceful island in the Vltava', lat:50.081952, lng:14.410329 },
  { name:'Petřín', cat:'place', desc:'Iconic wooded hill · views, tower, mirror maze', lat:50.081389, lng:14.393889 },
  { name:'Náplavka', cat:'place', desc:'Riverside embankment · boat bars, weekend farmers market', lat:50.069773, lng:14.414648 },
  { name:'Letenské sady', cat:'place', desc:'Favourite park with panoramic views over the city', lat:50.096529, lng:14.419671 },
  { name:'Stromovka', cat:'place', desc:'Royal park in Prague 7 · huge, flat and peaceful', lat:50.106329, lng:14.419129 },
  { name:'Riegrovy sady', cat:'place', desc:'Classic Prague sunset spot · castle views and beer garden', lat:50.080284, lng:14.441561 }
];

const CAT = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));
const enabledCats = new Set(CATEGORIES.map(c => c.key));
const markerByName = new Map();
let mapReady = false;
let leafMap;
let markers = [];

function escapeHtml(str) {
  return String(str).replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch]));
}

function mapsUrl(place) {
  const q = encodeURIComponent(`${place.name} ${place.lat},${place.lng}`);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function makeIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
    <path d="M14 0C6.27 0 0 6.27 0 14c0 9.33 14 22 14 22s14-12.67 14-22C28 6.27 21.73 0 14 0z" fill="${color}" stroke="white" stroke-width="2"/>
    <circle cx="14" cy="14" r="5" fill="white" opacity="0.9"/>
  </svg>`;
  return L.divIcon({ html: svg, className:'', iconSize:[28,36], iconAnchor:[14,36], popupAnchor:[0,-34] });
}

function renderFilters() {
  const nav = document.getElementById('filter-nav');
  nav.innerHTML = `
    <button class="filter-btn active" data-filter="all">All</button>
    ${CATEGORIES.map(c => `<button class="filter-btn" data-filter="${c.key}">${c.icon} ${c.short}</button>`).join('')}
  `;

  nav.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      nav.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const f = btn.dataset.filter;
      document.querySelectorAll('.section').forEach(s => s.classList.toggle('hidden', f !== 'all' && s.dataset.section !== f));
    });
  });
}

function renderList() {
  const main = document.getElementById('place-list');
  main.innerHTML = CATEGORIES.map(cat => {
    const places = PLACES.filter(p => p.cat === cat.key);
    return `
      <section class="section" data-section="${cat.key}">
        <div class="section-header">
          <span class="section-icon">${cat.icon}</span>
          <span class="section-title">${cat.label}</span>
          <span class="section-count">${places.length} ${places.length === 1 ? 'place' : 'places'}</span>
        </div>
        <div class="section-line"></div>
        ${places.map(p => `
          <a class="place-card" data-cat="${p.cat}" href="${mapsUrl(p)}" target="_blank" rel="noopener">
            <div class="card-dot" style="background:${cat.color}"></div>
            <div class="card-body">
              <div class="card-name">${escapeHtml(p.name)}</div>
              <div class="card-desc">${escapeHtml(p.desc)}</div>
            </div>
            <div class="card-arrow">↗</div>
          </a>
        `).join('')}
      </section>
    `;
  }).join('');
}

function initMap() {
  if (mapReady) return;
  mapReady = true;

  leafMap = L.map('map', { center:[50.088, 14.428], zoom:13, scrollWheelZoom:true });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors',
    maxZoom:19
  }).addTo(leafMap);

  PLACES.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: makeIcon(CAT[p.cat].color) })
      .bindPopup(`
        <div class="popup-name">${escapeHtml(p.name)}</div>
        <div class="popup-desc">${escapeHtml(p.desc)}</div>
        <a class="popup-link" href="${mapsUrl(p)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
      `, { maxWidth:230 });

    m._cat = p.cat;
    m._placeName = p.name;
    markers.push(m);
    markerByName.set(p.name, m);
    m.addTo(leafMap);
  });
}

function renderLegend() {
  const legend = document.getElementById('map-legend');
  legend.innerHTML = CATEGORIES.map(cat => {
    const places = PLACES.filter(p => p.cat === cat.key);
    return `
      <section class="legend-group" data-cat="${cat.key}">
        <button class="legend-row" data-cat="${cat.key}" type="button">
          <span class="legend-checkbox"></span>
          <span class="legend-dot" style="background:${cat.color}"></span>
          <span class="legend-label">${cat.short}</span>
          <span class="legend-count">${places.length}</span>
        </button>
        <div class="legend-names">
          ${places.map(p => `<button class="pin-name" data-place="${escapeHtml(p.name)}" type="button">${escapeHtml(p.name)}</button>`).join('')}
        </div>
      </section>
    `;
  }).join('');

  legend.querySelectorAll('.legend-row').forEach(row => {
    row.addEventListener('click', () => toggleCategory(row.dataset.cat));
  });

  legend.querySelectorAll('.pin-name').forEach(btn => {
    btn.addEventListener('click', () => {
      initMap();
      const marker = markerByName.get(btn.dataset.place);
      if (!marker) return;
      const cat = marker._cat;
      if (!enabledCats.has(cat)) toggleCategory(cat, true);
      leafMap.setView(marker.getLatLng(), 16, { animate:true });
      marker.openPopup();
    });
  });
}

function toggleCategory(cat, forceOn = false) {
  if (forceOn) enabledCats.add(cat);
  else if (enabledCats.has(cat)) enabledCats.delete(cat);
  else enabledCats.add(cat);
  updateCategoryVisibility();
}

function updateCategoryVisibility() {
  if (mapReady) {
    markers.forEach(m => {
      const shouldShow = enabledCats.has(m._cat);
      if (shouldShow && !leafMap.hasLayer(m)) m.addTo(leafMap);
      if (!shouldShow && leafMap.hasLayer(m)) leafMap.removeLayer(m);
    });
  }

  document.querySelectorAll('.legend-group').forEach(group => {
    const isOn = enabledCats.has(group.dataset.cat);
    group.classList.toggle('off', !isOn);
    const row = group.querySelector('.legend-row');
    if (row) row.classList.toggle('off', !isOn);
  });
}

function setAllCategories(on) {
  enabledCats.clear();
  if (on) CATEGORIES.forEach(c => enabledCats.add(c.key));
  updateCategoryVisibility();
}

const btnList  = document.getElementById('btn-list');
const btnMap   = document.getElementById('btn-map');
const listView = document.getElementById('list-view');
const mapView  = document.getElementById('map-view');
const filterNav= document.getElementById('filter-nav');

btnList.addEventListener('click', () => {
  btnList.classList.add('active');
  btnMap.classList.remove('active');
  listView.style.display = 'block';
  mapView.classList.remove('active');
  filterNav.style.display = 'flex';
});

btnMap.addEventListener('click', () => {
  btnMap.classList.add('active');
  btnList.classList.remove('active');
  listView.style.display = 'none';
  mapView.classList.add('active');
  filterNav.style.display = 'none';
  initMap();
  setTimeout(() => leafMap && leafMap.invalidateSize(), 80);
});

document.getElementById('show-all').addEventListener('click', () => setAllCategories(true));
document.getElementById('hide-all').addEventListener('click', () => setAllCategories(false));

document.getElementById('header-sub').textContent = `${PLACES.length} places · ${CATEGORIES.length} categories`;
renderFilters();
renderList();
renderLegend();
</script>
</body>
</html>
